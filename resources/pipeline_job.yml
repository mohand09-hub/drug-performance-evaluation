resources:
  jobs:
    drug_evaluation_pipeline:
      name: "${var.job_name}"
      
      # Define serverless environment (replaces job_clusters)
      environments:
        - environment_key: drug_pipeline_serverless
          spec:
            client: "1"
            dependencies:
              - "pytz"
      
      tasks:
        - task_key: bronze_load
          environment_key: drug_pipeline_serverless
          spark_python_task:
            python_file: ../scripts/bronze_load.py
            parameters:
              - ../config/project_config.json
        
        - task_key: silver_transform
          environment_key: drug_pipeline_serverless
          depends_on:
            - task_key: bronze_load
          spark_python_task:
            python_file: ../scripts/silver_transform.py
            parameters:
              - ../config/project_config.json
        
        - task_key: gold_analytics
          environment_key: drug_pipeline_serverless
          depends_on:
            - task_key: silver_transform
          spark_python_task:
            python_file: ../scripts/gold_analytics.py
            parameters:
              - ../config/project_config.json
      
      schedule:
        quartz_cron_expression: "${var.schedule_cron}"
        timezone_id: "America/New_York"
        pause_status: "PAUSED"
      
      email_notifications:
        on_failure:
          - "${var.notification_email}"
      
      max_concurrent_runs: 1
      timeout_seconds: 7200
      
      tags:
        project: "drug-performance-evaluation"
        environment: "${var.environment}"
